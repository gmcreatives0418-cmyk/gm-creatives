<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1a1a2e" stroke="#d4af37" stroke-width="3"/>
  
  <!-- Inner decorative circle -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.5"/>
  
  <!-- Shield/Badge shape with blue accent -->
  <g transform="translate(100, 100)">
    <!-- Central V shape -->
    <path d="M -15 -20 L 0 15 L 15 -20" stroke="#5b9fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Left accent -->
    <circle cx="-20" cy="-5" r="4" fill="#d4af37"/>
    <!-- Right accent -->
    <circle cx="20" cy="-5" r="4" fill="#d4af37"/>
  </g>
  
  <!-- Text circle -->
  <text x="100" y="160" font-size="10" font-weight="bold" fill="#d4af37" text-anchor="middle" letter-spacing="2">PREMIUM</text>
</svg>