    <path d="M 20 -15 L 25 -25" stroke="#c9a563" stroke-width="1" fill="none" opacity="0.6"/>
    
    <!-- Central text -->
    <text x="0" y="0" font-size="24" font-weight="bold" fill="#8b6f47" text-anchor="middle" font-family="Georgia, serif">GM</text>
    <text x="0" y="18" font-size="8" font-weight="600" fill="#c9a563" text-anchor="middle" letter-spacing="1">BAKERY</text>
